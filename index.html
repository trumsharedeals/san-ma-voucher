<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voucher Hunter - Kho Mã Giảm Giá Grab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>

  <!-- Google tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DTTCMQWZ0L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DTTCMQWZ0L');
  </script>
</head>
<body class="bg-gray-50 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-emerald-600 text-white py-6 shadow-md mb-6">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold flex items-center gap-2">
          <span>🎟️</span> Voucher Hunter
        </h1>
        <p class="text-emerald-100 text-sm mt-1">Update liên tục mã giảm giá nhập tay của Grab 11.11</p>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4">
    
    <!-- Control Bar -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 mb-6 space-y-4">
      <div class="flex flex-col md:flex-row gap-3 justify-between items-center">
        <div class="relative w-full md:w-96">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
          <input type="text" id="search-input" oninput="filterVouchers()" placeholder="Tìm tên mã hoặc ghi chú..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
          <button onclick="setStatusFilter('all')" id="filter-all" class="px-4 py-1.5 rounded-xl text-xs font-semibold bg-emerald-600 text-white shadow-sm transition">Tất cả</button>
          <button onclick="setStatusFilter('còn')" id="filter-con" class="px-4 py-1.5 rounded-xl text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition">Còn mã</button>
          <button onclick="setStatusFilter('coming')" id="filter-coming" class="px-4 py-1.5 rounded-xl text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition">Coming Soon</button>
          <button onclick="fetchVouchers()" class="ml-auto bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-3 py-1.5 rounded-xl transition flex items-center gap-1">🔄 Làm mới</button>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-3 border-t border-gray-100">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">📍 Lọc theo Khu vực (Áp dụng tại):</label>
          <select id="filter-apply-at" onchange="filterVouchers()" class="w-full border border-gray-300 rounded-xl px-3 py-1.5 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="">Tất cả khu vực</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">🍽️ Lọc theo Dịch vụ (Áp dụng cho):</label>
          <select id="filter-apply-for" onchange="filterVouchers()" class="w-full border border-gray-300 rounded-xl px-3 py-1.5 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="">Tất cả dịch vụ</option>
          </select>
        </div>
      </div>
    </div>

    <div id="status-msg" class="text-xs text-gray-500 mb-4 px-1">Đang tải dữ liệu...</div>
    <div id="voucher-container" class="space-y-6"></div>
  </main>

  <footer class="text-center text-xs text-gray-400 mt-12">
    © 2026 Voucher Hunter - Đồng bộ tự động từ Google Sheet
  </footer>

  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2 rounded-full shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50">
    Đã sao chép mã!
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw9PKvLpP6AQD0R_KXyGrxtuTgvhk7p4l8Exbyx_iP3YO1dnRVmDoR4Wtiz382DVfWG/exec";
    let allVouchers = [];
    let currentStatusFilter = 'all';

    async function fetchVouchers() {
      const container = document.getElementById('voucher-container');
      const msgEl = document.getElementById('status-msg');
      msgEl.innerText = "Đang đồng bộ dữ liệu từ Sheet...";

      try {
        const response = await fetch(API_URL);
        const result = await response.json();

        if (result.success && result.data.length > 0) {
          allVouchers = result.data;
          updateFilterDropdowns();
          filterVouchers();
        } else {
          msgEl.innerText = "Không tìm thấy mã nào.";
          container.innerHTML = `<div class="bg-white text-center py-10 rounded-2xl text-gray-500 border border-gray-200">Chưa có mã voucher nào.</div>`;
        }
      } catch (error) {
        msgEl.innerText = "Lỗi kết nối API Google Sheet.";
        container.innerHTML = `<div class="bg-red-50 text-red-600 text-center py-6 rounded-2xl border border-red-200">Không thể kết nối đến Google Sheet.</div>`;
      }
    }

    function updateFilterDropdowns() {
      const applyAtSet = new Set();
      const applyForSet = new Set();

      allVouchers.forEach(item => {
        if (item.applyAt && item.applyAt.toLowerCase() !== 'cả nước') applyAtSet.add(item.applyAt);
        if (item.applyFor) {
          item.applyFor.split(',').forEach(part => applyForSet.add(part.trim()));
        }
      });

      const atSelect = document.getElementById('filter-apply-at');
      const currentAt = atSelect.value;
      atSelect.innerHTML = '<option value="">Tất cả khu vực</option>' + [...applyAtSet].map(val => `<option value="${val}">${val}</option>`).join('');
      atSelect.value = currentAt;

      const forSelect = document.getElementById('filter-apply-for');
      const currentFor = forSelect.value;
      forSelect.innerHTML = '<option value="">Tất cả dịch vụ</option>' + [...applyForSet].map(val => `<option value="${val}">${val}</option>`).join('');
      forSelect.value = currentFor;
    }

    function setStatusFilter(status) {
      currentStatusFilter = status;
      ['all', 'con', 'coming'].forEach(s => {
        const btn = document.getElementById(`filter-${s}`);
        if (s === status) {
          btn.className = "px-4 py-1.5 rounded-xl text-xs font-semibold bg-emerald-600 text-white shadow-sm transition";
        } else {
          btn.className = "px-4 py-1.5 rounded-xl text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition";
        }
      });
      filterVouchers();
    }

    function filterVouchers() {
      const keyword = document.getElementById('search-input').value.toLowerCase();
      const selectedAt = document.getElementById('filter-apply-at').value;
      const selectedFor = document.getElementById('filter-apply-for').value;

      let filtered = allVouchers.filter(item => {
        const matchKeyword = item.isTurnedOn ? (item.code.toLowerCase().includes(keyword) || (item.note && item.note.toLowerCase().includes(keyword))) : (item.note && item.note.toLowerCase().includes(keyword));
        
        let matchStatus = true;
        if (currentStatusFilter === 'còn') matchStatus = item.isTurnedOn && item.status.toLowerCase() === 'còn';
        if (currentStatusFilter === 'coming') matchStatus = !item.isTurnedOn;

        // Mã "Cả nước" luôn hiện khi filter bất kỳ thành phố nào
        let matchAt = true;
        if (selectedAt) {
          const itemAt = item.applyAt ? item.applyAt.toLowerCase() : '';
          matchAt = (itemAt.includes('cả nước') || itemAt.includes(selectedAt.toLowerCase()));
        }

        let matchFor = !selectedFor || (item.applyFor && item.applyFor.toLowerCase().includes(selectedFor.toLowerCase()));

        return matchKeyword && matchStatus && matchAt && matchFor;
      });

      // Sắp xếp thứ tự: THIENDONNHOM top 1 -> Còn lượt -> Coming soon -> Hết lượt
      filtered.sort((a, b) => {
        if (a.code.toUpperCase() === 'THIENDONNHOM') return -1;
        if (b.code.toUpperCase() === 'THIENDONNHOM') return 1;

        const score = (item) => {
          if (item.isTurnedOn && item.status.toLowerCase() === 'còn') return 1;
          if (!item.isTurnedOn) return 2; // Coming soon
          return 3; // Hết lượt
        };

        return score(a) - score(b);
      });

      renderGroupedVouchers(filtered);
    }

    function renderGroupedVouchers(vouchers) {
      const container = document.getElementById('voucher-container');
      const msgEl = document.getElementById('status-msg');
      msgEl.innerText = `Hiển thị ${vouchers.length} mã phù hợp`;

      if (vouchers.length === 0) {
        container.innerHTML = `<div class="bg-white text-center py-10 rounded-2xl text-gray-500 border border-gray-200">Không tìm thấy mã nào phù hợp với bộ lọc.</div>`;
        return;
      }

      const groups = {};
      vouchers.forEach(item => {
        const groupKey = item.applyFor ? item.applyFor : "Khác";
        if (!groups[groupKey]) groups[groupKey] = [];
        groups[groupKey].push(item);
      });

      let html = '';
      for (const [groupName, items] of Object.entries(groups)) {
        html += `
          <div class="mb-6">
            <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-3 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span> ${groupName} (${items.length})
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${items.map(item => renderCard(item)).join('')}
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function renderCard(item) {
      const isTop1 = item.code.toUpperCase() === 'THIENDONNHOM';
      
      let statusBadge = '';
      if (!item.isTurnedOn) {
        statusBadge = `<span class="bg-amber-100 text-amber-700 text-[11px] font-semibold px-2.5 py-0.5 rounded-full">⏳ COMING SOON</span>`;
      } else if (item.status.toLowerCase() === 'còn') {
        statusBadge = `<span class="bg-emerald-100 text-emerald-700 text-[11px] font-semibold px-2.5 py-0.5 rounded-full">🟢 CÒN LƯỢT</span>`;
      } else {
        statusBadge = `<span class="bg-rose-100 text-rose-600 text-[11px] font-semibold px-2.5 py-0.5 rounded-full">🔴 HẾT LƯỢT</span>`;
      }

      const cardBorder = isTop1 ? 'border-2 border-red-500 shadow-md ring-2 ring-red-100' : 'border border-gray-200 shadow-sm hover:shadow-md';

      const displayCode = item.isTurnedOn ? item.code : "🔒 Sắp ra mắt...";
      const codeStyle = item.isTurnedOn ? (isTop1 ? 'text-red-600' : 'text-gray-900') : 'text-gray-400 italic';

      return `
        <div class="bg-white rounded-2xl ${cardBorder} p-4 transition flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between gap-2 border-b border-gray-100 pb-3 mb-3">
              <div class="flex items-center gap-2">
                <span class="font-mono text-lg font-bold ${codeStyle} tracking-wide">${displayCode}</span>
                ${isTop1 ? '<span class="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm">Được lấy nhiều nhất</span>' : ''}
              </div>
              ${statusBadge}
            </div>

            <div class="flex items-center justify-between text-xs text-gray-500 mb-2">
              <div>📍 ${item.applyAt || 'Cả nước'}</div>
              <div>🍽️ ${item.applyFor || 'Grab'}</div>
            </div>

            ${item.note ? `<div class="text-xs text-amber-800 bg-amber-50 p-2.5 rounded-xl mb-3 border border-amber-100">📌 ${item.note}</div>` : ''}
            
            ${!item.isTurnedOn && item.publishTime ? `
              <div class="bg-indigo-50 p-2.5 rounded-xl mb-3 border border-indigo-100 flex items-center justify-between">
                <span class="text-xs text-indigo-700 font-medium">⏰ Lên mã lúc: ${item.publishTime}</span>
                <a href="https://www.tiktok.com/@grab.vietnam" target="_blank" class="bg-black hover:bg-gray-800 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg shadow transition flex items-center gap-1">
                  🎬 Xem Live
                </a>
              </div>` : ''}
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-gray-50">
            <span class="text-[11px] text-gray-400">Lưu & nhập tại bước thanh toán</span>
            ${item.isTurnedOn ? `
              <button onclick="copyCode('${item.code}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow transition active:scale-95 flex items-center gap-1.5">
                📋 Sao chép
              </button>` : `
              <a href="https://www.tiktok.com/@grab.vietnam" target="_blank" class="bg-gray-200 text-gray-600 text-xs font-semibold px-4 py-2 rounded-xl hover:bg-gray-300 transition">
                🔗 Săn trên Live
              </a>`}
          </div>
        </div>
      `;
    }

    function copyCode(code) {
      navigator.clipboard.writeText(code);
      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 2000);

      fetch(`${API_URL}?action=copy&code=${encodeURIComponent(code)}`).catch(err => console.log(err));
    }

    fetchVouchers();
  </script>
</body>
</html>
